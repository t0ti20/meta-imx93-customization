# We have a recipes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "imx93-customization"
BBFILE_PATTERN_imx93-customization := "^${LAYERDIR}/"
BBFILE_PRIORITY_imx93-customization = "20"
LAYERSERIES_COMPAT_imx93-customization = "scarthgap"

# Absolute path to this layer's root -- used by bbclasses to locate helper
# scripts without hardcoding or relying on THISDIR at recipe-parse time.
IMX93_CUSTOMIZATION_LAYERDIR = "${LAYERDIR}"
