# LPUART5/6 header mode on FRDM-IMX93 connector P11 (see
# meta-imx-frdm's kernel patch 0013-arm64-dts-add-imx93-11x11-frdm-lpuart.dts).
# Switches U-Boot's default fdtfile so Linux boots with LPUART5's BT HCI child
# deleted (giving /dev/ttyLP4) and LPUART6 enabled (giving /dev/ttyLP5). Costs
# on-board Bluetooth (WiFi still works, it's on SDIO).
CONFIG_DEFAULT_FDT_FILE="imx93-11x11-frdm-lpuart.dtb"
